[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-wan22"
version = "0.1.0"
description = "Wan 2.2 I2V A14B + lightx2v 4-step LoRA on one Tenstorrent Blackhole p100a"
readme = "PYTHON.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# ttnn / tt-metal is not on PyPI: it comes from the tt-metal environment this runs in.
dependencies = [
    "torch",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "pillow",
    "sentencepiece",
    "diffusers",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["tt_wan22*"]
